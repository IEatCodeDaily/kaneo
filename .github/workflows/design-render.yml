name: Design render
# Renders docs/design-v3-*/ mockups headless and uploads the PNGs + geometry receipt.
on:
  push:
    branches: ["design/render-*"]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PKG: docs/design-v3-r5
    # Browser + system deps come baked in; no apt step to break on mirror outages.
    container: mcr.microsoft.com/playwright/python:v1.49.1-noble
    steps:
      - uses: actions/checkout@v6
      - name: Generate, check, render
        working-directory: ${{ env.PKG }}
        shell: bash  # -eo pipefail: a render crash behind `| tee` must fail the job
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install -q playwright==1.49.1
          python3 src/gen.py
          python3 src/render.py | tee render.log
          python3 src/check.py | tail -3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-png
          path: |
            ${{ env.PKG }}/png/
            ${{ env.PKG }}/*.html
            ${{ env.PKG }}/render.log
