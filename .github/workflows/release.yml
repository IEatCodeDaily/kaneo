name: Release
# Stable release, run by hand from main (Actions → Release → Run workflow).
# Version = YYYY.MMDD.HHmm in WIB (Asia/Jakarta) at dispatch time. Builds and
# pushes the GHCR images tagged with it (+ latest), then tags the commit
# v<version> and publishes a GitHub Release with generated notes.
# Production (task.noovoleum.site) then pins that image tag in
# noovoleum/infra-deploy-ucollect-internal-prod → stacks/kaneo/compose.yml.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Dispatched from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release runs from main only (got $GITHUB_REF)."
            exit 1
          fi

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json status,conclusion --jq '[.[] | select(.status == "completed")][0].conclusion')
          if [ "$result" != "success" ]; then
            echo "::error::CI on $GITHUB_SHA is '${result:-not finished}'. Release a commit whose CI passed."
            exit 1
          fi

      - name: Version
        id: version
        run: echo "version=$(TZ=Asia/Jakarta date +%Y.%m%d.%H%M)" >> "$GITHUB_OUTPUT"

  images:
    needs: prepare
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      latest: true

  publish:
    needs: [prepare, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes
          {
            echo "### Released v$VERSION"
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kaneo:$VERSION\`"
            echo "Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
