version: 2
updates:
  # Single entry at the workspace root. This repo is a pnpm workspace with one
  # root pnpm-lock.yaml, so dependabot must run from "/" to discover every
  # workspace package AND regenerate the shared lockfile. Targeting individual
  # subdirectories bumps each package.json but leaves the root lockfile stale,
  # which breaks `pnpm install --frozen-lockfile` in CI.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Let new releases age a week before proposing them (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      # Batch all non-major updates into a single PR to minimise lockfile churn.
      # Major bumps still open individually so they keep getting reviewed.
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Workflow actions are pinned to commit SHAs; this keeps the pins (and their
  # version comments) current. One grouped PR per month. On this fork both entries
  # need Settings → Advanced Security → Dependabot version updates switched on.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
